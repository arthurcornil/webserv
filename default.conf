server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost;
    root ./www;
    index index.html;
    client_max_body_size 1G;

    error_page 404 ./www/errors/404.html;
    error_page 500 ./www/errors/500.html;

    location / {
        allow_methods GET;
        autoindex off;
        index index.html;

    }

    location /directory {
        allow_methods GET POST;
        root /[ABSOLUTE PATH]/YoupiBanane;
        index youpi.bad_extension;
        cgi .bla /[ABSOLUTE PATH]/cgi_tester;

    }

    location /post_body {
        allow_methods POST;
        client_max_body_size 100B;
        cgi .bla /[ABSOLUTE PATH]/cgi_tester;
    }
}

server {
    listen 8081;
    host 127.0.0.1;
    server_name localhost;
    root /[ABSOLUTE PATH]/www;
    index index.html;
    client_max_body_size 1G;

    error_page 404 /[ABSOLUTE PATH]/www/errors/404.html;
    error_page 500 /[ABSOLUTE PATH]/www/errors/500.html;

    location / {
        allow_methods POST GET;
        autoindex off;
        index index.html;
        cgi .php /usr/bin/php-cgi;
    }

	location /uploads {
		root /tmp/webserv_uploads;
		upload_dir /tmp/webserv_uploads;
		allow_methods GET POST DELETE;
		autoindex on;
	}
}

server {
    listen 8082;
    host 127.0.0.1;
    server_name redirect_site;
    root /[ABSOLUTE PATH]/www;
    index index.html;
    client_max_body_size 10M;

    error_page 404 /[ABSOLUTE PATH]/www/errors/404.html;

    location / {
        allow_methods GET;
        autoindex off;
        return 301 http://localhost:8080;
    }
}
